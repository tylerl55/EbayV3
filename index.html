<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Inventory</title>
  <meta name="description" content="A simple list of the things you sell on eBay, with photos and profit.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>

  <main id="app">
    <noscript><p style="padding:24px">This app needs JavaScript. Please turn it on in your browser settings.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#items" data-tab="items">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span>Items</span>
    </a>
    <a href="#add" data-tab="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Add</span>
    </a>
    <a href="#sales" data-tab="sales">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M17 8c0-1.7-2.2-3-5-3S7 6.300 7 8.500c0 4.500 10 2.500 10 7 0 2.200-2.200 3.500-5 3.500s-5-1.300-5-3"/></svg>
      <span>Sales</span>
    </a>
    <a href="#more" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>More</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/calc.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/db.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
